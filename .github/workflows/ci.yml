name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags after v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache Kaggle dataset
        uses: actions/cache@v6
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-global-superstore

      - run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest
